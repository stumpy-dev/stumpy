[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "stumpy"
version = "1.14.1"
requires-python = ">=3.10"
authors = [
    {name = "Sean M. Law", email = "seanmylaw@gmail.com"}
]
description = "A powerful and scalable library that can be used for a variety of time series data mining tasks"
readme = "README.rst"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["time series", "matrix profile", "motif", "discord"]
maintainers = [
    {name = "Sean M. Law", email = "seanmylaw@gmail.com"},
    {name = "Nima Sarajpoor", email = "nimasarajpoor@gmail.com"}
]
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
dependencies = [
    "numpy >= 1.24",
    "scipy >= 1.10",
    "numba >= 0.61.2"
]

[tool.setuptools]
packages = ["stumpy"]

[project.optional-dependencies]
ci = [
    "pandas >= 0.20.0",
    "dask >= 1.2.2",
    "distributed >= 1.28.1",
    "coverage >= 4.5.3",
    "ruff >= 0.9.0",
    "pytest >= 4.4.1",
    'tbb >= 2019.5 ; platform_system == "Linux"',
    "polars >= 1.14.0",
    "lxml"
]

[project.urls]
Homepage = "https://github.com/stumpy-dev/stumpy"
Documentation = "https://stumpy.readthedocs.io/en/latest/"
Repository = "https://github.com/stumpy-dev/stumpy"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[tool.pixi.dependencies]
# All Conda dependencies.
# Ignores PyPI [dependencies] and [project.optional-dependencies] above
python = ">=3.10"
numpy = ">=1.24"
scipy = ">=1.10"
numba = ">=0.61.2"
# ci
pandas = ">=0.20.0"
dask = ">=1.2.2"
distributed =">=1.28.1"
coverage = ">=4.5.3"
ruff = ">=0.9.0"
pytest = ">=4.4.1"
polars = ">=1.14.0"
pip = "*"
lxml = "*"
numba-cuda = "*"
# readthedocs
sphinx = ">=3.5.3"
pydata-sphinx-theme = "*"
jupyterlab = "*"
matplotlib = "*"
scikit-learn = "*"
numpydoc = "*"
myst-nb = "*"
jupyterlab-myst = "*"
sphinx-togglebutton = "*"
# release
twine = "*"
python-build = "*"  # Equivalent to PyPI `build` package

[tool.pixi.activation]
# Always execute ./setup.sh when activating the default environment
# Note that 'stumpy' will only be listed via 'pip list | grep stumpy'
# and not via 'pixi list | grep stumpy' since 'pip install .' is used!
scripts = ["setup.sh"]

[tool.pixi.target.linux-64.dependencies]
# Conda dependencies specific to linux-64
tbb = ">=2019.5"

[tool.pixi.tasks]
# Note that ./setup.sh is executed during [tool.pixi.activation] above
tests = "./test.sh"
coverage = "./test.sh coverage"
docs = "cd docs && ./setup.sh"
lint = 'ruff check ./'
format = 'ruff format ./'

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "docs",
    "notebooks",
    ".venv",
    ".pixi",
]

[tool.ruff.lint]
# Enable pyflakes (F), pycodestyle (E, W), pydocstyle (D), and isort (I)
select = ["F", "E", "W", "D", "I"]
ignore = [
    "E741",   # Ambiguous variable name (matches flake8 E741 ignore)
    "D100",   # Missing docstring in public module
    "D401",   # First line of docstring should be in imperative mood
    "D200",   # No blank lines allowed after function docstring
    "D205",   # 1 blank line required between summary line and description
    "D400",   # First line should end with a period
    "D301",   # Use r"" if any backslashes in a docstring
]
# W503 (line break before binary operator) does not exist in ruff —
# ruff follows the updated PEP 8 guidance that prefers breaks before operators.
# E203 (whitespace before ':') does not exist in ruff —
# ruff is black-compatible by default and does not enforce this rule.

[tool.ruff.lint.per-file-ignores]
"stumpy/__init__.py" = ["D104"]           # Missing docstring in public package
"build/lib/stumpy/__init__.py" = ["D104"] # Missing docstring in public package
"tests/*" = ["D101", "D102", "D103"]      # Missing docstrings in test classes/methods/functions
"stumpy/cache.py" = ["D414"]              # Section has no content

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
# Match the previous isort config: isort --profile black
known-first-party = ["stumpy"]

[tool.ruff.format]
# Ruff's formatter is black-compatible by default.
# No additional configuration needed — line-length inherited from [tool.ruff].
